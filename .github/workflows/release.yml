name: Omanome Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_run:
    workflows: ["Omanome CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  promote-0-7:
    name: Tag the verified 0.7.0 main commit
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the green CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create the release tag once
        env:
          GH_TOKEN: ${{ github.token }}
          GREEN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')"
          test "$VERSION" = "0.7.0"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${VERSION}"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1 && [ "$(git rev-list -n 1 "${TAG}")" = "$GREEN_SHA" ]; then
            echo "${TAG} already points at the green commit"
            exit 0
          fi
          git tag -fa "${TAG}" "$GREEN_SHA" -m "Omanome ${VERSION}"
          git push origin "refs/tags/${TAG}" --force

  release:
    name: Validate and publish release
    needs: [promote-0-7]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && needs.promote-0-7.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'v0.7.0' || github.ref }}

      - name: Validate release metadata
        env:
          TAG_VERSION: ${{ github.event_name == 'workflow_run' && 'v0.7.0' || github.ref_name }}
        run: |
          VERSION="${TAG_VERSION#v}"
          python3 scripts/validate_version.py "$VERSION"
          make check
          make -C hypr/omanome-hypr test
          if pkg-config --exists hyprland; then
            make companion-check
          else
            echo 'Matching Hyprland development headers are unavailable on the release runner; portable companion physics test passed.'
          fi

      - name: Build source archive and checksums
        env:
          TAG_VERSION: ${{ github.event_name == 'workflow_run' && 'v0.7.0' || github.ref_name }}
        run: |
          VERSION="${TAG_VERSION#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="omanome-${VERSION}/" "$TAG_VERSION" > "dist/omanome-${VERSION}.tar.gz"
          sha256sum "dist/omanome-${VERSION}.tar.gz" > "dist/omanome-${VERSION}.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ github.event_name == 'workflow_run' && 'v0.7.0' || github.ref_name }}
        run: |
          VERSION="${TAG_VERSION#v}"
          if gh release view "$TAG_VERSION" >/dev/null 2>&1; then
            gh release upload "$TAG_VERSION" \
              "dist/omanome-${VERSION}.tar.gz" \
              "dist/omanome-${VERSION}.tar.gz.sha256" \
              --clobber
          else
            gh release create "$TAG_VERSION" \
              "dist/omanome-${VERSION}.tar.gz" \
              "dist/omanome-${VERSION}.tar.gz.sha256" \
              --verify-tag --title "Omanome ${VERSION}" --generate-notes
          fi
