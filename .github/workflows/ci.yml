name: Omanome CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    name: Portable validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate JSON documents
        run: |
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool config/defaults.json >/dev/null
          python3 -m json.tool config/schema.json >/dev/null

      - name: Validate project
        run: make validate

      - name: Run project tests
        run: |
          set +e
          output="$(python3 -m unittest tests.test_diagnostics.DiagnosticsTests.test_extended_hardware_fixtures_report_capabilities_without_certifying_hardware -v 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            summary="$(printf '%s\n' "$output" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error file=tests/test_diagnostics.py,line=55::$summary"
          fi
          exit "$status"

      - name: Run hardware diagnostic contract test
        run: python3 -m unittest tests.test_diagnostics.DiagnosticsTests.test_hardware_fixture_is_explicitly_not_certification -v

      - name: Run safe mode diagnostic contract test
        run: python3 -m unittest tests.test_diagnostics.DiagnosticsTests.test_safe_mode_has_explicit_status_and_does_not_need_omarchy -v

      - name: Run device diagnostic JSON contract test
        run: python3 -m unittest tests.test_diagnostics.DiagnosticsTests.test_stylus_and_touch_diagnostics_remain_json_without_hyprland -v

      - name: Run support bundle privacy contract test
        run: python3 -m unittest tests.test_diagnostics.DiagnosticsTests.test_support_bundle_excludes_personal_config_values -v

      - name: Run uninstall dry-run contract test
        run: python3 -m unittest tests.test_diagnostics.DiagnosticsTests.test_uninstall_dry_run_is_verified_and_non_destructive -v

      - name: Run uninstall symlink safety contract test
        run: python3 -m unittest tests.test_diagnostics.DiagnosticsTests.test_uninstall_refuses_symlink_targets -v

      - name: Run uninstall ownership contract test
        run: python3 -m unittest tests.test_diagnostics.DiagnosticsTests.test_uninstall_removes_owned_paths_but_keeps_settings_by_default -v

      - name: Run native input contract tests
        run: python3 -m unittest tests.test_input_protocol -v

      - name: Run performance safety tests
        run: python3 -m unittest tests.test_performance_safety -v

      - name: Run process policy tests
        run: python3 -m unittest tests.test_process_policy tests.test_process_watchdog -v

      - name: Run project contract tests
        run: python3 -m unittest tests.test_project -v

      - name: Run update lifecycle tests
        run: python3 -m unittest tests.test_update_lifecycle -v

      - name: Run QML lint
        run: make qmllint

      - name: Run portable capability and safety checks
        run: |
          make hardware-test
          make dependency-audit
          make performance-test
          make performance-check
          make version-check

      - name: Verify safety invariants
        run: |
          ! grep -RIn --exclude-dir=.git --exclude='*.md' 'xdotool\|gnome-shell[[:space:]]*--replace' .
          ! grep -RIn --exclude-dir=.git --exclude='*.md' 'pkill\|killall' shell input cli
          test -x input/force-quit.sh
          grep -Fq 'companion_pending_marker' cli/omanome
          python3 - <<'PY'
          import json
          manifest = json.load(open("manifest.json", encoding="utf-8"))
          assert "bar" not in manifest["kinds"]
          assert manifest["version"] == "0.9.0"
          PY

  companion-contract:
    name: Optional companion contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate companion without a desktop session
        run: |
          python3 -m json.tool hypr/omanome-hypr/compatibility.json >/dev/null
          test -f hypr/omanome-hypr/omanome-hypr.cpp
          test -f hypr/omanome-hypr/wobbly-effect.cpp
          test -f hypr/omanome-hypr/wobbly-effect.hpp
          make -C hypr/omanome-hypr test
          grep -Fq '__hyprland_api_get_hash' hypr/omanome-hypr/omanome-hypr.cpp
          grep -Fq '__hyprland_api_get_client_hash' hypr/omanome-hypr/omanome-hypr.cpp
          grep -Fq 'IWindowTransformer' hypr/omanome-hypr/wobbly-effect.cpp
          grep -Fq 'glClearColor(0.F, 0.F, 0.F, 0.F)' hypr/omanome-hypr/wobbly-effect.cpp
          ! grep -RIn 'LD_PRELOAD\|dlsym\|dlopen\|mprotect\|/proc/.*mem' hypr/omanome-hypr
          if pkg-config --exists hyprland; then
            make -C hypr/omanome-hypr check
          else
            echo 'Hyprland development headers are not installed on this runner; build remains an explicit local/manual gate.'
          fi

  performance-safety:
    name: Performance safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run static performance gate and owner-only process fixture
        run: |
          make performance-check
          python3 -m unittest tests.test_performance_safety -v
          python3 scripts/process_snapshot.py --json --sample-ms 0

  native-input:
    name: Native input helper
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Wayland and xkbcommon development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run native input contract and build gates
        run: make input-check

      - name: Smoke-test metadata mode without a desktop session
        run: |
          ./input/omanome-input/target/release/omanome-input --version
          ./input/omanome-input/target/release/omanome-input --protocol
